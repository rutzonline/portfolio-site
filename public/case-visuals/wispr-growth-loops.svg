<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 585"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#315736"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1040" height="585" rx="0" fill="#E5EDDA" stroke="none"/><text x="44" y="45" font-size="16" fill="#315736" font-weight="700">WISPR FLOW</text><text x="996" text-anchor="end" y="45" font-size="12" fill="#315736" font-weight="400">CONCEPTUAL PROPOSAL</text><text x="44" y="102" font-size="38" fill="#315736" font-weight="700">A transcript that travels</text><text x="44" y="143" font-size="20" fill="#315736" font-weight="400">Referral mechanisms to test after users experience the core value.</text><rect x="44" y="218" width="454" height="134" rx="16" fill="#FFFDF8" stroke="none"/><text x="64" y="259" font-size="26" fill="#315736" font-weight="700">Forward a voice note</text><text x="64" y="298" font-size="19" fill="#282824" font-weight="400">Start with a real receiving-side</text><text x="64" y="327" font-size="19" fill="#282824" font-weight="400">problem.</text><rect x="540" y="218" width="454" height="134" rx="16" fill="#FFFDF8" stroke="none"/><text x="560" y="259" font-size="26" fill="#315736" font-weight="700">Read the transcript</text><text x="560" y="298" font-size="19" fill="#282824" font-weight="400">Return the text with a tracked footer.</text><rect x="540" y="388" width="454" height="134" rx="16" fill="#FFFDF8" stroke="none"/><text x="560" y="429" font-size="26" fill="#315736" font-weight="700">Share it with a group</text><text x="560" y="468" font-size="19" fill="#282824" font-weight="400">Make the next user’s entry point</text><text x="560" y="497" font-size="19" fill="#282824" font-weight="400">visible.</text><rect x="44" y="388" width="454" height="134" rx="16" fill="#FFFDF8" stroke="none"/><text x="64" y="429" font-size="26" fill="#315736" font-weight="700">Try a reply in Flow</text><text x="64" y="468" font-size="19" fill="#282824" font-weight="400">Connect receiving value to sending</text><text x="64" y="497" font-size="19" fill="#282824" font-weight="400">value.</text><path d="M505 278 L532 278" stroke="#315736" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M766 359 L766 380" stroke="#315736" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M532 452 L505 452" stroke="#315736" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M270 380 L270 359" stroke="#315736" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>