<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 585"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#315736"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1040" height="585" rx="0" fill="#E5EDDA" stroke="none"/><text x="44" y="45" font-size="16" fill="#315736" font-weight="700">WISPR FLOW</text><text x="996" text-anchor="end" y="45" font-size="12" fill="#315736" font-weight="400">CONCEPTUAL PROPOSAL</text><text x="44" y="102" font-size="38" fill="#315736" font-weight="700">Keep the bot useful and sustainable</text><text x="44" y="143" font-size="20" fill="#315736" font-weight="400">Guardrails belong in the product and acquisition plan together.</text><rect x="44.0" y="217" width="301.3333333333333" height="246" rx="16" fill="#FFFDF8" stroke="none"/><text x="64.0" y="253" font-size="16" fill="#315736" font-weight="700">01</text><text x="64.0" y="306" font-size="25" fill="#315736" font-weight="400">Accuracy</text><text x="64.0" y="378" font-size="19" fill="#282824" font-weight="400">Test Hinglish. Pause</text><text x="64.0" y="407" font-size="19" fill="#282824" font-weight="400">pushes when complaints</text><text x="64.0" y="436" font-size="19" fill="#282824" font-weight="400">rise.</text><rect x="369.3333333333333" y="217" width="301.3333333333333" height="246" rx="16" fill="#FFFDF8" stroke="none"/><text x="389.3333333333333" y="253" font-size="16" fill="#315736" font-weight="700">02</text><text x="389.3333333333333" y="306" font-size="25" fill="#315736" font-weight="400">Privacy + scope</text><text x="389.3333333333333" y="378" font-size="19" fill="#282824" font-weight="400">Single-purpose bot. Make</text><text x="389.3333333333333" y="407" font-size="19" fill="#282824" font-weight="400">audio handling explicit.</text><rect x="694.6666666666666" y="217" width="301.3333333333333" height="246" rx="16" fill="#FFFDF8" stroke="none"/><text x="714.6666666666666" y="253" font-size="16" fill="#315736" font-weight="700">03</text><text x="714.6666666666666" y="306" font-size="25" fill="#315736" font-weight="400">Cost + retention</text><text x="714.6666666666666" y="378" font-size="19" fill="#282824" font-weight="400">Cap free use. Review</text><text x="714.6666666666666" y="407" font-size="19" fill="#282824" font-weight="400">repeat notes and</text><text x="714.6666666666666" y="436" font-size="19" fill="#282824" font-weight="400">referrals.</text></g></svg>