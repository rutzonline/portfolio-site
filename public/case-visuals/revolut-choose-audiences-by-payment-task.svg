<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 585"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#233E87"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1040" height="585" rx="0" fill="#DFE7FF" stroke="none"/><text x="44" y="45" font-size="16" fill="#233E87" font-weight="700">REVOLUT</text><text x="996" text-anchor="end" y="45" font-size="12" fill="#233E87" font-weight="400">CONCEPTUAL PROPOSAL</text><text x="44" y="102" font-size="38" fill="#233E87" font-weight="700">Qualify the journey before the fan</text><text x="44" y="143" font-size="20" fill="#233E87" font-weight="400">Audience selection depends on an upcoming task and supported product access.</text><rect x="44" y="219" width="464" height="276" rx="16" fill="#FFFDF8" stroke="none"/><text x="66" y="268" font-size="29" fill="#233E87" font-weight="700">Travellers</text><text x="66" y="313" font-size="22" fill="#282824" font-weight="400">Adults with a booked or actively</text><text x="66" y="345" font-size="22" fill="#282824" font-weight="400">planned trip within three months.</text><rect x="66" y="409" width="420" height="60" rx="9" fill="#DFE7FF" stroke="none"/><text x="80" y="445" font-size="19" fill="#233E87" font-weight="400">Check destination, existing card</text><text x="80" y="474" font-size="19" fill="#233E87" font-weight="400">and eligibility.</text><rect x="532" y="219" width="464" height="276" rx="16" fill="#FFFDF8" stroke="none"/><text x="554" y="268" font-size="29" fill="#233E87" font-weight="700">Screening attendees</text><text x="554" y="313" font-size="22" fill="#282824" font-weight="400">A separate exploratory cohort with</text><text x="554" y="345" font-size="22" fill="#282824" font-weight="400">a repeat payment need.</text><rect x="554" y="409" width="420" height="60" rx="9" fill="#DFE7FF" stroke="none"/><text x="568" y="445" font-size="19" fill="#233E87" font-weight="400">Test a benefit over the current</text><text x="568" y="474" font-size="19" fill="#233E87" font-weight="400">payment method.</text></g></svg>