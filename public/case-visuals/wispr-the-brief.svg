<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 585"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#315736"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1040" height="585" rx="0" fill="#E5EDDA" stroke="none"/><text x="44" y="45" font-size="16" fill="#315736" font-weight="700">WISPR FLOW</text><text x="996" text-anchor="end" y="45" font-size="12" fill="#315736" font-weight="400">CONCEPTUAL PROPOSAL</text><text x="44" y="102" font-size="38" fill="#315736" font-weight="700">From voice note to readable reply</text><text x="44" y="143" font-size="20" fill="#315736" font-weight="400">An India-first receiving-side workflow, with a hand-off to Wispr Flow.</text><rect x="55" y="215" width="420" height="280" rx="16" fill="#FFFDF8" stroke="none"/><text x="80" y="250" font-size="16" fill="#315736" font-weight="700">incoming voice note</text><rect x="85" y="280" width="355" height="84" rx="12" fill="#E5EDDA" stroke="none"/><rect x="140" y="314.0" width="5" height="16" rx="2" fill="#315736" stroke="none"/><rect x="156" y="306.5" width="5" height="31" rx="2" fill="#315736" stroke="none"/><rect x="172" y="300.0" width="5" height="44" rx="2" fill="#315736" stroke="none"/><rect x="188" y="310.5" width="5" height="23" rx="2" fill="#315736" stroke="none"/><rect x="204" y="298.0" width="5" height="48" rx="2" fill="#315736" stroke="none"/><rect x="220" y="303.5" width="5" height="37" rx="2" fill="#315736" stroke="none"/><rect x="236" y="312.0" width="5" height="20" rx="2" fill="#315736" stroke="none"/><rect x="252" y="300.5" width="5" height="43" rx="2" fill="#315736" stroke="none"/><rect x="268" y="308.0" width="5" height="28" rx="2" fill="#315736" stroke="none"/><rect x="284" y="313.5" width="5" height="17" rx="2" fill="#315736" stroke="none"/><rect x="300" y="299.5" width="5" height="45" rx="2" fill="#315736" stroke="none"/><rect x="316" y="307.5" width="5" height="29" rx="2" fill="#315736" stroke="none"/><rect x="332" y="302.5" width="5" height="39" rx="2" fill="#315736" stroke="none"/><rect x="348" y="310.0" width="5" height="24" rx="2" fill="#315736" stroke="none"/><rect x="364" y="314.5" width="5" height="15" rx="2" fill="#315736" stroke="none"/><text x="90" y="415" font-size="21" fill="#282824" font-weight="400">Listening is not always an option.</text><text x="90" y="452" font-size="21" fill="#315736" font-weight="700">Forward the note. Read the reply.</text><path d="M490 354 L544 354" stroke="#315736" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="566" y="215" width="420" height="280" rx="16" fill="#FFFDF8" stroke="none"/><text x="590" y="250" font-size="16" fill="#315736" font-weight="700">transcript + short summary</text><text x="590" y="300" font-size="24" fill="#282824" font-weight="400">Quick update: the meeting is</text><text x="590" y="334" font-size="24" fill="#282824" font-weight="400">at 3. Send the draft before</text><text x="590" y="368" font-size="24" fill="#282824" font-weight="400">lunch.</text><rect x="590" y="406" width="371" height="52" rx="10" fill="#E5EDDA" stroke="none"/><text x="610" y="438" font-size="21" fill="#315736" font-weight="700">Reply without typing →</text></g></svg>