<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 585"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#7042A2"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1040" height="585" rx="0" fill="#F1E4FC" stroke="none"/><text x="44" y="45" font-size="16" fill="#7042A2" font-weight="700">HEYCLICKY</text><text x="996" text-anchor="end" y="45" font-size="12" fill="#7042A2" font-weight="400">CONCEPTUAL PROPOSAL</text><text x="44" y="102" font-size="38" fill="#7042A2" font-weight="700">Keep the promise through install</text><text x="44" y="143" font-size="20" fill="#7042A2" font-weight="400">Match the ad task to the page, permissions and first-use experience.</text><rect x="44.0" y="217" width="301.3333333333333" height="246" rx="16" fill="#FFFDF8" stroke="none"/><text x="64.0" y="253" font-size="16" fill="#7042A2" font-weight="700">01</text><text x="64.0" y="306" font-size="25" fill="#7042A2" font-weight="400">Task-led page</text><text x="64.0" y="378" font-size="19" fill="#282824" font-weight="400">Show the demo,</text><text x="64.0" y="407" font-size="19" fill="#282824" font-weight="400">compatibility and plan</text><text x="64.0" y="436" font-size="19" fill="#282824" font-weight="400">terms.</text><path d="M348.3333333333333 339 L366.3333333333333 339" stroke="#7042A2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="369.3333333333333" y="217" width="301.3333333333333" height="246" rx="16" fill="#FFFDF8" stroke="none"/><text x="389.3333333333333" y="253" font-size="16" fill="#7042A2" font-weight="700">02</text><text x="389.3333333333333" y="306" font-size="25" fill="#7042A2" font-weight="400">Install + consent</text><text x="389.3333333333333" y="378" font-size="19" fill="#282824" font-weight="400">Explain permissions at</text><text x="389.3333333333333" y="407" font-size="19" fill="#282824" font-weight="400">the relevant step.</text><path d="M673.6666666666666 339 L691.6666666666666 339" stroke="#7042A2" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="694.6666666666666" y="217" width="301.3333333333333" height="246" rx="16" fill="#FFFDF8" stroke="none"/><text x="714.6666666666666" y="253" font-size="16" fill="#7042A2" font-weight="700">03</text><text x="714.6666666666666" y="306" font-size="25" fill="#7042A2" font-weight="400">Complete + return</text><text x="714.6666666666666" y="378" font-size="19" fill="#282824" font-weight="400">Offer an adjacent task</text><text x="714.6666666666666" y="407" font-size="19" fill="#282824" font-weight="400">after a useful first</text><text x="714.6666666666666" y="436" font-size="19" fill="#282824" font-weight="400">session.</text></g></svg>